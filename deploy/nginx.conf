# nginx site config для Smoky Ice Shop (pm2 + nginx, один VPS).
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ice-shop
#   sudo ln -s /etc/nginx/sites-available/ice-shop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените example.com на свой домен и /srv/ice-shop на путь к репозиторию.
# TLS-блоки дописывает certbot: sudo certbot --nginx -d example.com -d www.example.com

# Брутфорс по логину: в приложении rate limit не реализован, держим на прокси.
# 5 r/s с burst=10 — человеку хватает с запасом, перебору нет.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    # ponytail: h2c на plain HTTP не работает в браузерах (только h2 over TLS),
    # но директива наследуется в TLS-блок, который создаёт certbot --nginx
    # (он копирует существующий server и меняет listen на 443 ssl).
    # Требует nginx >= 1.25.1; на старых поставить `listen 443 ssl http2;` вручную.
    http2 on;
    server_name example.com www.example.com;

    root /srv/ice-shop/web/dist;
    index index.html;

    # Загрузка фото товара: multer разрешает 10 МБ. Дефолт nginx — 1 МБ,
    # и файл 1-10 МБ отвалился бы с 413 ещё до Node, а админка показала бы
    # невнятную ошибку сохранения.
    client_max_body_size 10m;

    # Аплоады админки лежат на диске; nginx отдаёт их напрямую, минуя Node.
    # Только картинки: фильтр multer смотрит на mime-type, но расширение берёт
    # из имени файла — без этого ограничения залитый .html отдавался бы как
    # text/html (хранимая XSS, пусть и только из-под админа).
    # root, а не alias: /uploads/x.png -> /srv/ice-shop/server/uploads/x.png,
    # без возни с captures в regex-location.
    location ~ ^/uploads/[^/]+\.(?:png|jpe?g|webp|gif)$ {
        root /srv/ice-shop/server;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /uploads/ {
        return 404;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        include /srv/ice-shop/deploy/proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        include /srv/ice-shop/deploy/proxy.conf;
    }

    # Хешированные ассеты Vite — имя меняется при каждой сборке.
    # nosniff дублируется в каждом location осознанно: add_header в location
    # полностью перекрывает унаследованные от server, а не дополняет их.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Фото каталога из web/public: имена стабильные между сборками,
    # поэтому immutable — браузер не делает условный RTT после устаревания.
    location /images/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # SPA: react-router обслуживает маршруты на клиенте, любой не-файл
    # обязан вернуть index.html, иначе /category/... даст 404 при F5.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем — иначе клиент останется на старой сборке
    # и будет тянуть уже удалённые хешированные ассеты.
    # Без `expires`: он выставил бы свой Cache-Control, и в ответе оказалось
    # бы два конфликтующих заголовка.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # helmet в приложении не подключён — базовые заголовки ставим здесь.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
