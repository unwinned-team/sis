# Заголовки для proxy_pass на Node. Вынесены отдельно вместо
# /etc/nginx/proxy_params: тот файл есть в Debian/Ubuntu, но не везде.
#
# X-Forwarded-For здесь критичен: приложение читает его через
# `app.set("trust proxy", TRUST_PROXY_HOPS)`. Без заголовка req.ip станет
# 127.0.0.1, и в AgeVerification уедет адрес прокси вместо покупателя.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
